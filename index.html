<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Open driver app</title>
<style>
:root{color-scheme:light dark;--bg:#f2f4f1;--ink:#1c2830;--muted:#5d6b72;--uni:#d9661f;--emi:#2367b3}
@media (prefers-color-scheme:dark){:root{--bg:#141b20;--ink:#e6ecea;--muted:#9aa8ad;--uni:#e07a3a;--emi:#5b9be0}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:17px/1.4 -apple-system,system-ui,sans-serif;padding:24px;box-sizing:border-box;text-align:center}
.box{display:grid;gap:16px;max-width:360px}
a.btn{display:block;padding:16px;border-radius:14px;color:#fff;text-decoration:none;font-weight:700;font-size:19px}
.u{background:var(--uni)}.e{background:var(--emi)}
p{margin:0;color:var(--muted);font-size:15px}
</style>
</head>
<body>
<div class="box">
  <div id="msg">Opening…</div>
  <a id="btn" class="btn" href="#">Open app</a>
  <p>If nothing happens, tap the button. The first time, iPhone asks to confirm.<br>Then swipe back to Safari for the route.</p>
</div>
<script>
// ?app=uniuni → runs the "Open UniUni" shortcut (UniUni Driver has no link of its own)
// ?app=emile  → runs the "Open Emile" shortcut
var TARGETS={
  uniuni:{label:'UniUni Driver',cls:'u',url:'shortcuts://run-shortcut?name='+encodeURIComponent('Open UniUni')},
  emile:{label:'Emile Driver',cls:'e',url:'shortcuts://run-shortcut?name='+encodeURIComponent('Open Emile')}
};
var app=(new URLSearchParams(location.search).get('app')||'').toLowerCase();
var t=TARGETS[app];
var btn=document.getElementById('btn'),msg=document.getElementById('msg');
if(!t){msg.textContent='Unknown app. Use ?app=uniuni or ?app=emile';btn.hidden=true}
else{
  msg.textContent='Opening '+t.label+'…';
  btn.textContent='Open '+t.label;btn.className='btn '+t.cls;btn.href=t.url;
  setTimeout(function(){location.href=t.url},150);
}
</script>
</body>
</html>
